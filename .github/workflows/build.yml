name: Build

# Baut bei jedem Push und Pull Request. Bei einem Tag v* entsteht zusätzlich ein GitHub Release.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MunzQuickTweaks.slnx

      - name: Build
        run: dotnet build MunzQuickTweaks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MunzQuickTweaks.Tests -c Release --no-build

      - name: Publish (portable .exe)
        run: dotnet publish src/MunzQuickTweaks.App -c Release -o publish

      - name: Prüfsumme
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/MunzQuickTweaks.exe -Algorithm SHA256).Hash
          "$hash  MunzQuickTweaks.exe" | Out-File publish/MunzQuickTweaks.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: MunzQuickTweaks-${{ github.sha }}
          path: |
            publish/MunzQuickTweaks.exe
            publish/MunzQuickTweaks.exe.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/MunzQuickTweaks.exe
            publish/MunzQuickTweaks.exe.sha256
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') }}
