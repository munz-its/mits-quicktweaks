name: Build

# Baut bei jedem Push und Pull Request. Ein GitHub Release entsteht bei einem Tag v* oder bei einem Push auf main,
# wenn es zur Version in Directory.Build.props noch kein Release gibt (Tag wird dann von GitHub angelegt).
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MunzQuickTweaks.slnx

      - name: Build
        run: dotnet build MunzQuickTweaks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MunzQuickTweaks.Tests -c Release --no-build

      - name: Publish (portable .exe)
        run: dotnet publish src/MunzQuickTweaks.App -c Release -o publish

      - name: Prüfsumme
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/MunzQuickTweaks.exe -Algorithm SHA256).Hash
          "$hash  MunzQuickTweaks.exe" | Out-File publish/MunzQuickTweaks.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: MunzQuickTweaks-${{ github.sha }}
          path: |
            publish/MunzQuickTweaks.exe
            publish/MunzQuickTweaks.exe.sha256
          if-no-files-found: error

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo ${{ github.repository }} *> $null
          $exists = if ($LASTEXITCODE -eq 0) { '1' } else { '0' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, Release vorhanden: $exists"
          $global:LASTEXITCODE = 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.version.outputs.exists == '0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Munz Quick Tweaks ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            publish/MunzQuickTweaks.exe
            publish/MunzQuickTweaks.exe.sha256
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
